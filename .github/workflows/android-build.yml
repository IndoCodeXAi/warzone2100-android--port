name: Android Build (arm64-v8a)

on:
  workflow_dispatch: {}
  push:
    branches: [ "android-port" ]

env:
  ANDROID_ABI: arm64-v8a
  ANDROID_PLATFORM_LEVEL: 24
  VCPKG_TARGET_TRIPLET: arm64-android
  SDL_RELEASE_TAG: release-3.2.16   # pin a known SDL3 tag; bump deliberately, not blindly

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout warzone2100 (with this Android scaffold already applied)
        uses: actions/checkout@v4

      - name: Free up disk space (this build is large)
        run: |
          sudo rm -rf /usr/local/lib/android/sdk/ndk 2>/dev/null || true
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup || true

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK + NDK (manual — see note below)
        # NOTE: this used to call android-actions/setup-android@v3, which by
        # default tries to install a package literally named "tools". Google
        # removed that legacy package from the SDK repository years ago, so
        # the action failed immediately with "Failed to find package 'tools'"
        # before any of the real build work ran. ubuntu-latest runners
        # already ship a working Android SDK + sdkmanager, so we just use
        # that directly and skip the action entirely.
        run: |
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          # sdkmanager exists on the runner but isn't on PATH by default —
          # find it rather than assume a fixed cmdline-tools version number.
          SDKMANAGER_PATH=$(find "$ANDROID_SDK_ROOT/cmdline-tools" -maxdepth 4 -type f -name "sdkmanager" | sort -V | tail -1)
          if [ -z "$SDKMANAGER_PATH" ]; then
            echo "Could not locate sdkmanager under $ANDROID_SDK_ROOT/cmdline-tools — listing what's there:"
            find "$ANDROID_SDK_ROOT/cmdline-tools" -maxdepth 3
            exit 1
          fi
          echo "Using sdkmanager at: $SDKMANAGER_PATH"
          yes | "$SDKMANAGER_PATH" --licenses >/dev/null || true
          "$SDKMANAGER_PATH" --install "platform-tools" "platforms;android-34" "ndk;26.3.11579264"
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/26.3.11579264" >> "$GITHUB_ENV"

      - name: Preflight — verify overlay-port patch files exist in the checkout
        # This exists ONLY to turn a vague vcpkg error into a clear yes/no
        # answer about whether these files actually made it into the repo.
        # If this step fails, the problem is 100% in how the repo was
        # pushed/uploaded, not in the workflow or in vcpkg.
        run: |
          MISSING=0
          for f in \
            ".ci/vcpkg/overlay-ports/basisu/export-cmake-config.diff" \
            ".ci/vcpkg/overlay-ports/openal-soft/pkgconfig-cxx.diff" \
            ".ci/vcpkg/overlay-ports/angle/001-fix-builder-error.patch" \
            ".ci/vcpkg/overlay-ports/protobuf/fix-arm64-llvm-win.patch" \
          ; do
            if [ -f "$f" ]; then
              echo "OK   found: $f ($(wc -c < "$f") bytes)"
            else
              echo "MISSING: $f"
              MISSING=1
            fi
          done
          if [ "$MISSING" = "1" ]; then
            echo ""
            echo "::error::One or more vcpkg overlay-port patch files are missing from this checkout."
            echo "This means the .ci/ folder in the GitHub repo itself is incomplete —"
            echo "open the repo in a browser (not an app) and check these exact paths by hand."
            exit 1
          fi

      - name: Bootstrap vcpkg
        run: |
          git clone https://github.com/microsoft/vcpkg.git "$HOME/vcpkg"
          "$HOME/vcpkg/bootstrap-vcpkg.sh"
          echo "VCPKG_ROOT=$HOME/vcpkg" >> "$GITHUB_ENV"

      - name: Install host build tools (Ninja + autotools for vcpkg ports like libsodium)
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build autoconf autoconf-archive automake libtool

      - name: Configure (CMake + vcpkg Android triplet)
        run: |
          cmake -S . -B build-android -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" \
            -DVCPKG_CHAINLOAD_TOOLCHAIN_FILE="$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake" \
            -DVCPKG_TARGET_TRIPLET="$VCPKG_TARGET_TRIPLET" \
            -DANDROID_ABI="$ANDROID_ABI" \
            -DANDROID_PLATFORM="android-$ANDROID_PLATFORM_LEVEL" \
            -DANDROID_STL=c++_shared \
            -DCMAKE_SYSTEM_NAME=Android \
            -DCMAKE_SYSTEM_VERSION="$ANDROID_PLATFORM_LEVEL" \
            -DCMAKE_ANDROID_ARCH_ABI="$ANDROID_ABI" \
            -DCMAKE_ANDROID_NDK="$ANDROID_NDK_HOME" \
            -DCMAKE_BUILD_TYPE=Release
          # ^ If this step fails on a specific vcpkg port, the log will name
          # it directly (look for "error:" near a port name under
          # build-android/vcpkg_installed/.../buildtrees/<port>/). Paste that
          # section back — don't just paste "it failed".

      - name: Build native engine + data archives
        run: |
          cmake --build build-android --target warzone2100 --parallel
          cmake --build build-android --target data --parallel

      - name: Locate build outputs (debug step — keep this, it's cheap insurance)
        run: |
          echo "--- looking for libmain.so ---"
          find build-android -name "libmain.so" -o -name "libwarzone2100.so"
          echo "--- looking for data archives ---"
          find build-android -iname "*.wz" | head -20

      - name: Stage native lib into the Gradle module
        run: |
          mkdir -p android/app/src/main/jniLibs/arm64-v8a
          # One of these two names will exist depending on how CMake named it;
          # the CMakeLists patch sets OUTPUT_NAME to "main" but this is kept
          # defensive in case a vendored sub-dependency changes that.
          SO_PATH=$(find build-android -name "libmain.so" | head -1)
          cp "$SO_PATH" android/app/src/main/jniLibs/arm64-v8a/libmain.so
          # SDL3 itself, if built as a shared lib by the chosen vcpkg
          # triplet, needs to ship alongside it:
          SDL_SO=$(find "$VCPKG_ROOT/installed/$VCPKG_TARGET_TRIPLET" -name "libSDL3.so" 2>/dev/null | head -1)
          if [ -n "$SDL_SO" ]; then
            cp "$SDL_SO" android/app/src/main/jniLibs/arm64-v8a/libSDL3.so
          fi
          # libc++_shared.so from the NDK sysroot (matches ANDROID_STL above):
          CXX_SHARED=$(find "$ANDROID_NDK_HOME" -path "*aarch64-linux-android*" -name "libc++_shared.so" | head -1)
          cp "$CXX_SHARED" android/app/src/main/jniLibs/arm64-v8a/libc++_shared.so

      - name: Stage game data into Android assets
        run: |
          mkdir -p android/app/src/main/assets/data
          # Adjust this glob once the previous "Locate build outputs" step
          # shows the real output directory for base.wz / mp.wz etc.
          find build-android -iname "*.wz" -exec cp {} android/app/src/main/assets/data/ \;

      - name: Vendor SDL3's Android Java glue (org.libsdl.app.*)
        run: |
          git clone --depth 1 --branch "$SDL_RELEASE_TAG" https://github.com/libsdl-org/SDL.git "$RUNNER_TEMP/sdl3"
          mkdir -p android/app/src/main/java/org/libsdl/app
          cp "$RUNNER_TEMP"/sdl3/android-project/app/src/main/java/org/libsdl/app/*.java \
             android/app/src/main/java/org/libsdl/app/

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Assemble debug APK
        run: |
          cd android
          gradle assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: warzone2100-android-debug
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
